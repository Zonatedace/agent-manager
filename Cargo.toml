[package]
name = "agent-manager"
version = "0.1.0"
edition = "2021"
description = "Agent Manager - Windows desktop app for multi-repo TODO.md, git, multi-agent sessions, usage meters"
repository = "https://github.com/Zonatedace/agent-manager"
homepage = "https://github.com/Zonatedace/agent-manager"
readme = "README.md"
license = "MIT"
keywords = ["todo", "agents", "desktop", "windows", "rust"]
categories = ["gui", "development-tools"]

[[bin]]
name = "agent-manager"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
open = "5"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = { version = "2", features = ["json"] }

# Windows desktop shell (WebView2) + optional Windows Service host.
# Linux/Docker server builds omit these so the image stays lean (no agents, no UI shell).
[target.'cfg(windows)'.dependencies]
tao = "0.32"
wry = "0.50"
windows-service = "0.8"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
